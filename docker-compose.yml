services:
  agy-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agy-api:dev
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      AGY_API_TOKEN: "${AGY_API_TOKEN:?set AGY_API_TOKEN in environment}"
      AGY_ACP_BIN: "/home/agy/.local/bin/agy"
      AGY_ACP_ARGS: "${AGY_ACP_ARGS:-acp}"
      AGY_WORKSPACE: "/workspace"
      AGY_PERMISSION_POLICY: "${AGY_PERMISSION_POLICY:-allow_all}"
    volumes:
      - agy-gemini-data:/home/agy/.gemini
      - ${AGY_HOST_WORKSPACE:-.}:/workspace
    restart: unless-stopped

volumes:
  agy-gemini-data:
